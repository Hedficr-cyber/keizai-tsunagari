<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>経済のつながり</title>
<meta name="description" content="経済・金融のニュースと有識者の見方を集め、原因と影響のつながりで学ぶ個人用アプリ">
<meta name="theme-color" content="#f3f3f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="つながり">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/relationships.css">
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="78 118 364 260" aria-hidden="true"><polyline points="118,338 210,246 302,292 394,166" fill="none" stroke="currentColor" stroke-width="28" stroke-linejoin="round" stroke-linecap="round"/><circle cx="118" cy="338" r="36" fill="currentColor"/><circle cx="210" cy="246" r="36" fill="currentColor"/><circle cx="302" cy="292" r="36" fill="currentColor"/><circle cx="394" cy="166" r="44" fill="var(--up)"/></svg>
      経済のつながり
    </div>
    <div class="stamp" id="stamp"></div>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-today" aria-label="今日"></section>
  <section class="view" id="v-news" aria-label="ニュース"></section>
  <section class="view" id="v-map" aria-label="つながり"></section>
  <section class="view" id="v-experts" aria-label="有識者"></section>
</main>

<nav class="nav" aria-label="画面の切り替え">
  <a href="#today" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>今日</a>
  <a href="#news" data-v="news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2.5"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>ニュース</a>
  <a href="#map" data-v="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7L11.8 5M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.5"/></svg>つながり</a>
  <a href="#experts" data-v="experts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18.5V7a2.5 2.5 0 0 1 2.5-2.5h11A2.5 2.5 0 0 1 20 7v7a2.5 2.5 0 0 1-2.5 2.5H8z"/><path d="M8.5 9.5h7M8.5 12.5h4.5"/></svg>有識者</a>
</nav>

<div class="update" id="update" hidden><span>新しい版（<span id="update-v"></span>）があります</span><button id="update-btn">更新する</button></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="termcard" id="termcard" hidden role="dialog" aria-modal="true" aria-label="用語の説明" tabindex="-1"><div class="tc-h"><b id="tc-term"></b><span id="tc-tag"></span></div><p id="tc-exp"></p><div class="tc-btns"><button id="tc-node" class="btn ghost" hidden></button><button id="tc-close" class="btn">わかった</button></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="false" aria-hidden="true" inert aria-label="詳細" tabindex="-1"><div class="inner"><div class="grab"><button class="sheet-back" id="sheet-back" hidden>‹ 戻る</button><button class="close" id="sheet-close">閉じる</button></div><div id="sheet-body"></div></div></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
